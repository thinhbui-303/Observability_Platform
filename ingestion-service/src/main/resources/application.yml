server:
  port: 8081

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/observability
    username: ${POSTGRES_USER:obs_user}
    password: ${POSTGRES_PASSWORD:obs_password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: snappy
      batch-size: 32768
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.99, 0.95, 0.5

actuator:
  allowed-ip-ranges: 127.0.0.1/32, 172.16.0.0/12
