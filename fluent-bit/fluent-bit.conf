[SERVICE]
    Flush           1
    Log_Level       info
    storage.path    /fluent-bit/buffer
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name            tail
    Path            /var/log/app/*.log
    Parser          json
    Refresh_Interval 2
    storage.type    filesystem
    Read_from_Head  True
    Inotify_Watcher Off

[FILTER]
    Name            record_modifier
    Match           *
    Record          _source fluent-bit

[OUTPUT]
    Name            http
    Match           *
    Host            host.docker.internal
    Port            8081
    URI             /api/v1/telemetry/logs/batch/raw
    Header          X-API-Key ${FLUENTBIT_API_KEY}
    Format          json
    json_date_key   timestamp
    json_date_format iso8601
    Retry_Limit     False
